name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: phpunit (sqlite hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, mbstring, fileinfo, openssl, tokenizer, ctype, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync

  demo:
    name: demo.sh hermetic
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, mbstring, fileinfo, openssl, tokenizer, ctype, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      # Prove demo hermeticity: a hostile DB_* environment must NOT divert
      # the demo away from its throwaway sqlite DB (regression guard for the
      # mktemp/host-DB_* bug). scripts/demo.sh forces sqlite itself.
      - name: Run hermetic demo
        run: bash scripts/demo.sh
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ci-should-not-use-this
          DB_USERNAME: ci-should-not-use-this
          DB_PASSWORD: ci-should-not-use-this
