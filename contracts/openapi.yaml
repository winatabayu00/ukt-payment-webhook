openapi: 3.0.3
info:
  title: UKT Payment API
  version: 1.4.0
  description: >
    Reconciled with the verified Laravel implementation (Phase 1 + prod hardening
    + queue worker/monitoring + webhook audit-gap fixes). Tenant for invoice APIs
    is resolved from a per-institution API token in the Authorization: Bearer
    header via ResolveInstitution (only the SHA-256 hash is stored in
    institutions.api_token_hash); webhook tenant comes from
    payload.institution_code plus HMAC-SHA256 X-Signature over the raw body
    (plain hex or sha256=<hex>). sqlite is the verified local/test driver;
    pgsql env placeholders are user-managed. Invoice routes throttle per token,
    webhook per IP. payment.success additionally dispatches a queued
    NotifyPaymentSuccessJob (database driver) after commit; unexpected processor
    failures mark the receipt failed/internal_error and return 500 for gateway
    retry. Gateway timestamps outside the occurred_at window are rejected 422;
    success for a time-expired unpaid invoice is ignored without money movement.
    Ops visibility via `php artisan webhook:monitor`; retention via
    `php artisan webhook:prune`; webhook secret rotation via
    `php artisan institution:webhook-secret <CODE> --rotate`.
    Standard envelope (v1.4.0): CRUD success is {success:true, message, data, meta?};
    CRUD/auth/validation/malformed errors are {success:false, message, error:{code, details?}};
    webhook deliveries are {success:bool, message, data:{processing_status, failure_reason}}
    with processed/duplicate/ignored ⇒ success:true 200 and rejected/failed/malformed ⇒ success:false 4xx/500.
    Keys data.* and error.code are stable; success+message are additive. No secrets/signatures/traces in bodies.
components:
  securitySchemes:
    institutionToken:
      type: http
      scheme: bearer
      description: Per-institution API token (plaintext never stored; only SHA-256). Issue via `php artisan institution:token <CODE>`. Missing/unknown yields 401.
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Invoice created.
        data:
          description: Resource payload (object, array, or null); webhook keeps {processing_status, failure_reason}.
        meta:
          type: object
          description: Pagination ({current_page, per_page, total}) on student invoice list.
    ErrorEnvelope:
      type: object
      required: [success, message, error]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: The request is invalid.
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
              description: Stable codes incl. INSTITUTION_UNRESOLVED, INSTITUTION_UNKNOWN, NOT_FOUND, VALIDATION_FAILED, MALFORMED_PAYLOAD, UNAUTHENTICATED, FORBIDDEN, METHOD_NOT_ALLOWED, CONFLICT, CSRF_TOKEN_MISMATCH, RATE_LIMITED, REQUEST_FAILED, INTERNAL_ERROR.
            details:
              description: Laravel-style {field:[messages]} on 422 VALIDATION_FAILED; omitted otherwise.
    WebhookEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          description: true for processed/duplicate/ignored (200); false for rejected/failed/malformed (4xx/500).
        message:
          type: string
          example: Webhook processed.
        data:
          type: object
          required: [processing_status, failure_reason]
          properties:
            processing_status:
              type: string
              enum: [processed, duplicate, ignored, rejected, failed]
            failure_reason:
              type: string
              nullable: true
              example: signature_invalid
              description: Stable categories only (e.g. signature_invalid, amount_mismatch, invoice_not_found, occurred_at_too_old, success_after_expiry, internal_error); never secrets/signatures.
servers:
  - url: /api
paths:
  /invoices:
    post:
      summary: Create a UKT invoice in the resolved institution
      security:
        - institutionToken: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_number, semester, invoice_number, amount, expires_at]
              properties:
                student_number:
                  type: string
                  maxLength: 64
                semester:
                  type: string
                  pattern: '^\d{4}-[12]$'
                  example: 2026-1
                invoice_number:
                  type: string
                  maxLength: 64
                  description: Unique per institution_id; reusable across institutions.
                amount:
                  type: string
                  example: "1500000.00"
                expires_at:
                  type: string
                  format: date-time
                  description: Must be after now.
      responses:
        "201":
          description: Invoice created (status unpaid). Body is SuccessEnvelope {success:true, message, data:invoice}.
        "401":
          description: ErrorEnvelope {success:false, message, error.code INSTITUTION_UNRESOLVED|INSTITUTION_UNKNOWN}.
        "422":
          description: ErrorEnvelope {success:false, error.code VALIDATION_FAILED, error.details:{field:[messages]}}, incl. duplicate invoice_number.
        "429":
          description: ErrorEnvelope {success:false, error.code RATE_LIMITED} (throttle:api-invoices, per token per minute).
  /invoices/{invoiceId}:
    get:
      summary: Get invoice status/details within the resolved institution
      security:
        - institutionToken: []
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SuccessEnvelope {success:true, message, data:invoice} (id string, amount 2dp string, expires_at ISO8601, status unpaid|paid|expired).
        "401":
          description: Missing/unknown institution.
        "404":
          description: ErrorEnvelope {success:false, error.code NOT_FOUND} (incl. cross-tenant hidden).
        "429":
          description: Rate limit exceeded.
  /invoices/{invoiceId}/transactions:
    get:
      summary: List payment transactions for an invoice (tenant-scoped)
      security:
        - institutionToken: []
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SuccessEnvelope {success:true, message, data:transaction[]} ordered (possibly empty).
        "401":
          description: Missing/unknown institution.
        "404":
          description: Not found or cross-tenant (NOT_FOUND).
        "429":
          description: Rate limit exceeded.
  /students/{studentNumber}/invoices:
    get:
      summary: List invoices for a student in the resolved institution (paginated)
      security:
        - institutionToken: []
      parameters:
        - in: path
          name: studentNumber
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SuccessEnvelope {success:true, message, data:invoice[], meta:{current_page,per_page,total}} (15 per page).
        "401":
          description: Missing/unknown institution.
        "429":
          description: Rate limit exceeded.
  /webhooks/payments:
    post:
      summary: Receive payment gateway event (HMAC-verified, audited, idempotent)
      parameters:
        - in: header
          name: X-Signature
          required: true
          schema:
            type: string
          description: Lowercase hex HMAC-SHA256 over the raw request body using the institution webhook_secret; the common `sha256=<hex>` prefix form is also accepted (case-insensitive). Compared constant-time. Rotate via `php artisan institution:webhook-secret <CODE> --rotate` (encrypted at rest).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - institution_code
                - event_type
                - event_id
                - invoice_number
                - gateway_transaction_id
                - amount
              properties:
                institution_code:
                  type: string
                  example: CAMPUS-ALPHA
                event_type:
                  type: string
                  enum: [payment.success, payment.expired]
                event_id:
                  type: string
                  description: Required; idempotency key scoped by institution_id.
                invoice_number:
                  type: string
                gateway_transaction_id:
                  type: string
                  description: Unique per institution_id on payment_transactions; reuse returns duplicate 200.
                amount:
                  type: string
                  description: Must be numeric > 0; for payment.success must exactly match invoice amount else 422 amount_mismatch.
                occurred_at:
                  type: string
                  format: date-time
                  description: Optional; absent or empty ⇒ stored as null. A present but unparseable value is rejected 422 occurred_at_invalid. Values older than WEBHOOK_OCCURRED_AT_MAX_PAST_DAYS (default 30) are rejected 422 occurred_at_too_old; values more than WEBHOOK_OCCURRED_AT_MAX_FUTURE_MINUTES (default 15) in the future are rejected 422 occurred_at_in_future.
      responses:
        "200":
          description: >
            processed (state moved; payment.success also queues NotifyPaymentSuccessJob
            after commit), duplicate (event_id or gateway_transaction_id already seen),
            or ignored (already_final / success_after_expiry, incl. a success for an
            unpaid invoice already past expires_at — marked expired, no transaction row).
            Body is WebhookEnvelope {success:true, message, data:{processing_status,failure_reason}}.
        "400":
          description: ErrorEnvelope for malformed JSON (MALFORMED_PAYLOAD) or WebhookEnvelope {success:false, data.failure_reason institution_code_missing}.
        "401":
          description: WebhookEnvelope {success:false, data:{processing_status:rejected, failure_reason:institution_unknown|signature_invalid}}. Audited in webhook_receipts.
        "422":
          description: WebhookEnvelope {success:false, data:{processing_status:rejected, failure_reason}} for event_type_unknown, event_id_missing, invoice_number_missing, gateway_transaction_missing, amount_invalid, invoice_not_found, amount_mismatch, occurred_at_invalid, occurred_at_too_old, occurred_at_in_future.
        "429":
          description: ErrorEnvelope {success:false, error.code RATE_LIMITED} (throttle:api-webhooks, per IP per minute).
        "500":
          description: WebhookEnvelope {success:false, data:{processing_status:failed, failure_reason:internal_error}}; safe for gateway retry (see webhook:monitor + logs).
