openapi: 3.0.3
info:
  title: UKT Payment API
  version: 1.2.0
  description: >
    Reconciled with the verified Laravel implementation (Phase 1 + prod hardening
    + queue worker/monitoring). Tenant for invoice APIs is resolved from a
    per-institution API token in the Authorization: Bearer header via
    ResolveInstitution (only the SHA-256 hash is stored in
    institutions.api_token_hash); webhook tenant comes from
    payload.institution_code plus HMAC-SHA256 X-Signature over the raw body.
    sqlite is the verified local/test driver; pgsql env placeholders are
    user-managed. Invoice routes throttle per token, webhook per IP.
    payment.success additionally dispatches a queued NotifyPaymentSuccessJob
    (database driver) after commit; unexpected processor failures mark the
    receipt failed/internal_error and return 500 for gateway retry. Ops
    visibility via `php artisan webhook:monitor`.
components:
  securitySchemes:
    institutionToken:
      type: http
      scheme: bearer
      description: Per-institution API token (plaintext never stored; only SHA-256). Issue via `php artisan institution:token <CODE>`. Missing/unknown yields 401.
servers:
  - url: /api
paths:
  /invoices:
    post:
      summary: Create a UKT invoice in the resolved institution
      security:
        - institutionToken: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_number, semester, invoice_number, amount, expires_at]
              properties:
                student_number:
                  type: string
                  maxLength: 64
                semester:
                  type: string
                  pattern: '^\d{4}-[12]$'
                  example: 2026-1
                invoice_number:
                  type: string
                  maxLength: 64
                  description: Unique per institution_id; reusable across institutions.
                amount:
                  type: string
                  example: "1500000.00"
                expires_at:
                  type: string
                  format: date-time
                  description: Must be after now.
      responses:
        "201":
          description: Invoice created (status unpaid).
        "401":
          description: Missing/unknown Bearer API token (INSTITUTION_UNRESOLVED / INSTITUTION_UNKNOWN).
        "422":
          description: Validation failed, including duplicate invoice_number within this institution.
        "429":
          description: Rate limit exceeded (throttle:api-invoices, per token per minute).
  /invoices/{invoiceId}:
    get:
      summary: Get invoice status/details within the resolved institution
      security:
        - institutionToken: []
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invoice details (id as string, amount as 2dp string, expires_at ISO8601, status unpaid|paid|expired).
        "401":
          description: Missing/unknown institution.
        "404":
          description: Not found or not visible within the current tenant (cross-tenant hidden as NOT_FOUND).
        "429":
          description: Rate limit exceeded.
  /invoices/{invoiceId}/transactions:
    get:
      summary: List payment transactions for an invoice (tenant-scoped)
      security:
        - institutionToken: []
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered transaction list (possibly empty). Each item has id, gateway_transaction_id, event_type, amount, occurred_at.
        "401":
          description: Missing/unknown institution.
        "404":
          description: Not found or cross-tenant (NOT_FOUND).
        "429":
          description: Rate limit exceeded.
  /students/{studentNumber}/invoices:
    get:
      summary: List invoices for a student in the resolved institution (paginated)
      security:
        - institutionToken: []
      parameters:
        - in: path
          name: studentNumber
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Paginated invoice list (15 per page) with data[] plus meta.current_page/per_page/total.
        "401":
          description: Missing/unknown institution.
        "429":
          description: Rate limit exceeded.
  /webhooks/payments:
    post:
      summary: Receive payment gateway event (HMAC-verified, audited, idempotent)
      parameters:
        - in: header
          name: X-Signature
          required: true
          schema:
            type: string
          description: Lowercase hex HMAC-SHA256 over the raw request body using the institution webhook_secret; compared constant-time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - institution_code
                - event_type
                - event_id
                - invoice_number
                - gateway_transaction_id
                - amount
              properties:
                institution_code:
                  type: string
                  example: CAMPUS-ALPHA
                event_type:
                  type: string
                  enum: [payment.success, payment.expired]
                event_id:
                  type: string
                  description: Required; idempotency key scoped by institution_id.
                invoice_number:
                  type: string
                gateway_transaction_id:
                  type: string
                  description: Unique per institution_id on payment_transactions; reuse returns duplicate 200.
                amount:
                  type: string
                  description: Must be numeric > 0; for payment.success must exactly match invoice amount else 422 amount_mismatch.
                occurred_at:
                  type: string
                  format: date-time
                  description: Optional; absent or empty ⇒ stored as null. A present but unparseable value is rejected 422 occurred_at_invalid.
      responses:
        "200":
          description: >
            processed (state moved; payment.success also queues NotifyPaymentSuccessJob
            after commit), duplicate (event_id or gateway_transaction_id already seen),
            or ignored (already_final / success_after_expiry). Body is {data:{processing_status,failure_reason}}.
        "400":
          description: Malformed JSON (MALFORMED_PAYLOAD) or institution_code_missing.
        "401":
          description: institution_unknown or signature_invalid. Every delivery is still audited in webhook_receipts.
        "422":
          description: event_type_unknown, event_id_missing, invoice_number_missing, gateway_transaction_missing, amount_invalid, invoice_not_found, amount_mismatch, occurred_at_invalid.
        "429":
          description: Rate limit exceeded (throttle:api-webhooks, per IP per minute).
        "500":
          description: Unexpected internal failure; receipt marked failed/internal_error (see webhook:monitor + logs), safe for gateway retry.
